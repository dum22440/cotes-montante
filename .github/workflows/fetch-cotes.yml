name: Fetch cotes (OddsPapi)

on:
  schedule:
    - cron: "30 21 * * *"   # tous les jours à 23h30 heure de Paris (avant le brief de 00h01)
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  cotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_cotes.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      - run: |
          git config user.name "bot-cotes"
          git config user.email "bot-cotes@users.noreply.github.com"
          git add cotes_oddspapi.json cotes_oddspapi_brutes.json
          git commit -m "Cotes du $(date +%F)" || echo "Rien de nouveau"
          git pull --rebase && git push
